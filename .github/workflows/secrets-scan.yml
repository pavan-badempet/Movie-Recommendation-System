name: Secrets Scanning

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly on Monday at 7 AM UTC
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect Leaked Secrets (Gitleaks)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history so gitleaks can scan all commits on a PR
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Set GITLEAKS_LICENSE if you have a commercial license; free for public repos
        GITLEAKS_ENABLE_COMMENTS: "true"

  trufflehog:
    name: Detect Leaked Secrets (TruffleHog)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run TruffleHog OSS
      uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2
      with:
        path: ./
        extra_args: --debug --only-verified
